<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store Asset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  /* docs/DESIGN.md 토큰 — border가 있으면 radius 0, 장식 없음, 좌측 정렬 */
  :root {
    --bg: #0e1418;
    --surface-1: #131b21;
    --text-primary: #f5f9fc;
    --text-secondary: #d7e1e8;
    --text-muted: #8c9aa5;
    --accent: #1d9bf0;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --font-body: "IBM Plex Sans KR", "IBM Plex Sans JP", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
    /* 제품명은 확장 UI와 같은 Display 글꼴 (한·일 글자가 없어 제목 문구에는 쓰지 않음) */
    --font-display: "Space Grotesk", var(--font-body);
  }
  :lang(ja) { --font-body: "IBM Plex Sans JP", "IBM Plex Sans KR", sans-serif; }
  /* 일본어는 띄어쓰기가 없어 keep-all이면 줄이 안 바뀌고 잘린다 */
  :lang(ja) body { word-break: normal; line-break: strict; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  .frame { overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }

  /* ── 스크린샷 1280×800 ──
     스토어 갤러리에서는 약 46%(590px 폭)로 줄어 보인다. 줄어든 뒤에도 읽히도록 글자는 크게, UI는 핵심만 잘라 약 2배로.
     글은 왼쪽 열, 화면은 오른쪽·아래 가장자리까지 붙인다 */
  .shot {
    width: 1280px; height: 800px; padding: 64px 0 0 64px;
    display: grid; grid-template-columns: 470px 1fr; column-gap: 40px;
  }
  .text { min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 60px; }
  .label { font-size: 24px; font-weight: 500; color: var(--text-muted); }
  h1 {
    margin-top: 16px; font-size: 64px; font-weight: 700;
    line-height: 1.16; letter-spacing: -0.015em; white-space: pre-line;
  }
  .desc { margin-top: 24px; font-size: 28px; line-height: 1.5; color: var(--text-secondary); white-space: pre-line; }
  .brand { margin-top: auto; display: flex; align-items: center; gap: 12px; }
  .brand img { width: 34px; height: 34px; }
  .product { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-secondary); }
  .visual { min-height: 0; overflow: hidden; }
  .visual img {
    display: block; max-width: none;
    border-top: 1px solid var(--border-subtle); border-left: 1px solid var(--border-subtle);
  }

  /* ── X 타임라인 재현 (확장이 그리는 숨김 표시와 같은 스타일·문구) ── */
  .timeline {
    background: #000; border: 1px solid #2f3336; border-right: none; min-height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, var(--font-body);
  }
  .tl-head { padding: 16px 20px; font-size: 19px; font-weight: 700; color: #e7e9ea; border-bottom: 1px solid #2f3336; }
  .tweet { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #2f3336; }
  .tweet > div { min-width: 0; }
  .avatar { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; }
  /* X처럼 이름 줄이 길면 말줄임 */
  .tw-meta { font-size: 15px; color: #71767b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tw-meta b { color: #e7e9ea; font-weight: 700; margin-right: 4px; }
  .tw-text { margin-top: 3px; font-size: 15px; line-height: 1.4; color: #e7e9ea; }
  .hidden-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 0 16px; border-bottom: 1px solid #2f3336;
    color: #536471; font-size: 13px;
  }
  .hidden-row svg { flex-shrink: 0; width: 16px; height: 16px; opacity: 0.6; }

  /* ── 작은 프로모 타일 440×280 ── */
  .promo { width: 440px; height: 280px; padding: 30px 32px; }
  .promo .mark { display: flex; align-items: center; gap: 10px; }
  .promo .mark img { width: 34px; height: 34px; }
  .promo .mark span { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); }
  .promo h1 { margin-top: auto; font-family: var(--font-display); font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; }
  .promo .desc { margin-top: 12px; padding-left: 14px; border-left: 3px solid var(--accent); font-size: 17px; line-height: 1.4; }

  /* ── 마키 1400×560 ── */
  .marquee { width: 1400px; height: 560px; padding: 56px 0 0 72px; }
  .marquee .body { height: 100%; display: grid; grid-template-columns: 1fr 640px; column-gap: 64px; }
  .marquee .mark { display: flex; align-items: center; gap: 14px; }
  .marquee .mark img { width: 44px; height: 44px; }
  .marquee .mark span { font-family: var(--font-mono); font-size: 20px; color: var(--text-muted); }
  .marquee h1 { margin-top: auto; font-size: 66px; line-height: 1.1; }
  .marquee .desc { margin-top: 22px; padding-left: 20px; border-left: 3px solid var(--accent); font-size: 28px; }
</style>
</head>
<body>
<main id="frame" class="frame" data-fit="frame"></main>
<script>
  // render.mjs가 window.__ASSET__을 넣는다
  const asset = window.__ASSET__;
  document.documentElement.lang = asset.lang;
  const frame = document.getElementById('frame');
  const SHIELD = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L2 3.5v4c0 3.5 2.6 6.4 6 7.5 3.4-1.1 6-4 6-7.5v-4L8 1zm0 2.2l4 1.7v2.6c0 2.6-1.9 4.8-4 5.7-2.1-.9-4-3.1-4-5.7V4.9l4-1.7z"/></svg>';

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function timeline(spec) {
    const box = el('div', 'timeline');
    box.append(el('div', 'tl-head', spec.heading));
    for (const row of spec.rows) {
      if (row.hidden) {
        const hidden = el('div', 'hidden-row');
        hidden.innerHTML = SHIELD;
        hidden.append(row.hidden);
        box.append(hidden);
        continue;
      }
      const tweet = el('div', 'tweet');
      const avatar = el('div', 'avatar');
      avatar.style.background = row.color;
      const content = el('div');
      const meta = el('div', 'tw-meta');
      meta.append(el('b', '', row.name), `@${row.handle} · ${row.time}`);
      content.append(meta, el('div', 'tw-text', row.text));
      tweet.append(avatar, content);
      box.append(tweet);
    }
    return box;
  }

  // 캡처는 3배율이므로 CSS 크기 = 원본 픽셀 / 3. scale배로 키워 보여준다
  const CAPTURE_DPR = 3;
  function visual(spec) {
    const figure = el('figure', 'visual');
    if (spec.type === 'timeline') {
      const box = timeline(spec);
      box.style.zoom = String(spec.zoom ?? 1);
      figure.append(box);
    } else {
      const img = el('img');
      img.addEventListener('load', () => {
        img.style.width = `${(img.naturalWidth / CAPTURE_DPR) * spec.scale}px`;
      });
      img.src = spec.src;
      figure.append(img);
    }
    return figure;
  }

  function mark() {
    const box = el('div', 'mark');
    const icon = el('img');
    icon.src = asset.icon;
    box.append(icon, el('span', '', asset.url));
    return box;
  }

  if (asset.kind === 'screenshot') {
    frame.classList.add('shot');
    const text = el('section', 'text');
    text.dataset.fit = 'text';
    const brand = el('div', 'brand');
    const icon = el('img');
    icon.src = asset.icon;
    brand.append(icon, el('span', 'product', asset.product));
    text.append(el('p', 'label', asset.label), el('h1', '', asset.title), el('p', 'desc', asset.desc), brand);
    frame.append(text, visual(asset.visual));
  } else if (asset.kind === 'promo') {
    frame.classList.add('promo');
    frame.append(mark(), el('h1', '', asset.title), el('p', 'desc', asset.desc));
  } else {
    frame.classList.add('marquee');
    const text = el('section', 'text');
    text.dataset.fit = 'text';
    text.append(mark(), el('h1', '', asset.title), el('p', 'desc', asset.desc));
    const body = el('div', 'body');
    body.append(text, visual(asset.visual));
    frame.append(body);
  }
</script>
</body>
</html>
