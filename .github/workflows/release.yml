name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run E2E tests
        run: xvfb-run npx playwright test
        continue-on-error: ${{ contains(github.ref_name, '-test') }}

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 태그와 package.json 버전이 다르면 스토어에 엉뚱한 버전이 제출된다 (-test 접미사는 무시)
      - name: Verify tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "${TAG_NAME%%-test*}" != "$VERSION" ]; then
            echo "::error::태그 ${TAG_NAME}와 package.json 버전 ${VERSION}이 다릅니다"
            exit 1
          fi

      - name: Package Chrome, Edge, Firefox (+ Firefox sources)
        run: bash scripts/package-release.sh "$TAG_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zips
          path: release/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zips
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-test') }}

  # 스토어별 독립 제출 — 한 스토어가 실패해도 나머지는 계속 진행된다.
  # (이전 구조는 순차 스텝이라 Firefox AMO 실패 시 Edge가 매번 건너뛰어졌다: v1.4.1, v1.6.0)
  # 실패한 스토어만 다시 보내려면 Actions > Submit to Store를 수동 실행한다 (docs/STORE_SETUP.md).
  submit:
    needs: release
    if: ${{ !contains(github.ref_name, '-test') }}
    strategy:
      fail-fast: false
      matrix:
        store: [chrome, firefox, edge]
    uses: ./.github/workflows/submit-store.yml
    with:
      store: ${{ matrix.store }}
      tag: ${{ github.ref_name }}
      dry-run: false
    # 스토어별로 해당 시크릿만 전달 (secrets: inherit는 모든 저장소 시크릿을 넘긴다)
    secrets:
      CHROME_EXTENSION_ID: ${{ matrix.store == 'chrome' && secrets.CHROME_EXTENSION_ID || '' }}
      CHROME_CLIENT_ID: ${{ matrix.store == 'chrome' && secrets.CHROME_CLIENT_ID || '' }}
      CHROME_CLIENT_SECRET: ${{ matrix.store == 'chrome' && secrets.CHROME_CLIENT_SECRET || '' }}
      CHROME_REFRESH_TOKEN: ${{ matrix.store == 'chrome' && secrets.CHROME_REFRESH_TOKEN || '' }}
      FIREFOX_EXTENSION_ID: ${{ matrix.store == 'firefox' && secrets.FIREFOX_EXTENSION_ID || '' }}
      FIREFOX_JWT_ISSUER: ${{ matrix.store == 'firefox' && secrets.FIREFOX_JWT_ISSUER || '' }}
      FIREFOX_JWT_SECRET: ${{ matrix.store == 'firefox' && secrets.FIREFOX_JWT_SECRET || '' }}
      EDGE_PRODUCT_ID: ${{ matrix.store == 'edge' && secrets.EDGE_PRODUCT_ID || '' }}
      EDGE_CLIENT_ID: ${{ matrix.store == 'edge' && secrets.EDGE_CLIENT_ID || '' }}
      EDGE_API_KEY: ${{ matrix.store == 'edge' && secrets.EDGE_API_KEY || '' }}
